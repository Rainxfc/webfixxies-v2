<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asset Embed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }
        model-viewer {
            width: 100%;
            max-width: 800px;
            height: 600px;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="public/nexbot_robot_character_concept.glb" 
        alt="3D Robot Character"
        auto-rotate
        camera-controls
        ar
        shadow-intensity="1">
    </model-viewer>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.js"></script>
</body>
</html>
